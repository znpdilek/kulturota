# =============================================================================
# KültürRota — Geliştirme Ortamı Servisleri
# PRD v2.0 · Bölüm 16: PostgreSQL 16 + PostGIS, Redis 7
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + PostGIS — Operasyonel veritabanı (PRD Bölüm 7/16/18)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: kulturrota-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kulturrota}
      POSTGRES_USER: ${POSTGRES_USER:-kulturrota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kulturrota_dev}
      # tr_TR.UTF8 collation - PRD 8.4: Türkçe lower-case için
      LANG: C.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kulturrota} -d ${POSTGRES_DB:-kulturrota}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kulturrota-net

  # ---------------------------------------------------------------------------
  # Redis 7 — Rate limit, LLM decision cache, hot-key cache (PRD Bölüm 9/18)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: kulturrota-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kulturrota-net

  # ---------------------------------------------------------------------------
  # MinIO — S3 uyumlu object store (PRD Bölüm 13 + 16: Foto + Bronze parquet)
  # Lokal geliştirme/test için; prod'da AWS S3 ile değiştirilir, kod aynı kalır.
  # Adım 6 (Medya Yönetimi): /v1/photos endpoint'i bu servise yazar.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: kulturrota-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-kulturrota}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-kulturrota_dev_secret}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET_PHOTOS:-kulturrota-photos}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"      # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # Web Console (http://localhost:9001)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kulturrota-net

  # ---------------------------------------------------------------------------
  # MinIO bucket kurucu — kalkışta bucket'ı oluşturup public-read policy verir.
  # Idempotent: kontrol eder, varsa atlar; yoksa yaratır.
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: kulturrota-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - kulturrota-net
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kulturrota}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-kulturrota_dev_secret}
      S3_BUCKET_PHOTOS: ${S3_BUCKET_PHOTOS:-kulturrota-photos}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" 2>/dev/null; do
        echo 'minio hazır değil, 2sn bekleniyor...'; sleep 2;
      done;
      mc mb --ignore-existing local/\"$$S3_BUCKET_PHOTOS\";
      mc anonymous set download local/\"$$S3_BUCKET_PHOTOS\";
      echo 'Bucket hazır: '$$S3_BUCKET_PHOTOS;
      "

volumes:
  postgres_data:
    name: kulturrota_postgres_data
  redis_data:
    name: kulturrota_redis_data
  minio_data:
    name: kulturrota_minio_data

networks:
  kulturrota-net:
    name: kulturrota-net
    driver: bridge
